# Configuration for the RuboCop Rails extension. See README.

# Allow e.g. `list.compact_blank` and disallow `list.reject(&:blank)`.
Rails/CompactBlank:
  Enabled: true

# Allow e.g. `String#end_with?` and disallow `String#ends_with?`.
Rails/ActiveSupportAliases:
  Enabled: true

# Allow e.g. `list.index_with { value(it) }` and disallow `list.to_h { [it, value(it)] }`.
Rails/IndexWith:
  Enabled: true
